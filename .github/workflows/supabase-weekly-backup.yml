name: Supabase Weekly Backup to Cloudflare R2

on:
  schedule:
    # Executa todo dia às 03:00 UTC (00:00 no horário de Brasília)
    - cron: "0 3 * * *"
  workflow_dispatch: # Permite disparo manual pela aba Actions do GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Rclone for S3/R2 Sync
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone p7zip-full

      - name: Dump PostgreSQL Database (Roles, Schema & Data)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          mkdir -p backup_db

          echo "Exportando roles..."
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup_db/roles.sql --role-only

          echo "Exportando schema (incluindo metadados de auth e storage)..."
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup_db/schema.sql

          echo "Exportando dados..."
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup_db/data.sql --data-only --use-copy

          echo "Compactando e criptografando com senha..."
          7z a -t7z -mhe=on -p"${{ secrets.BACKUP_ENCRYPTION_KEY }}" "db_backup_${TIMESTAMP}.7z" backup_db/
          echo "ARCHIVE_NAME=db_backup_${TIMESTAMP}.7z" >> $GITHUB_ENV

      - name: Configure Rclone (Supabase Storage S3 -> Cloudflare R2)
        env:
          # Credenciais S3 do Supabase Storage (Storage > Settings > S3 Connection)
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_S3_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
          SUPABASE_S3_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
          # Credenciais S3 do Cloudflare R2 (R2 > Manage R2 API Tokens)
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [supabase_storage]
          type = s3
          provider = Other
          access_key_id = ${SUPABASE_S3_ACCESS_KEY}
          secret_access_key = ${SUPABASE_S3_SECRET_KEY}
          endpoint = ${SUPABASE_S3_ENDPOINT}
          region = ${SUPABASE_S3_REGION}
          force_path_style = true

          [cloudflare_r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          no_head = true
          EOF

      - name: Upload Database Dump to Cloudflare R2
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          rclone copy "${ARCHIVE_NAME}" "cloudflare_r2:${R2_BUCKET_NAME}/database/" --s3-no-check-bucket --s3-no-head --progress

      - name: Sync Supabase Storage Files Incrementally to Cloudflare R2
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # 'rclone copy' copia apenas imagens novas ou alteradas (incremental),
          # sem apagar no R2 arquivos que tenham sido deletados acidentalmente no Supabase.
          rclone copy "supabase_storage:" "cloudflare_r2:${R2_BUCKET_NAME}/storage_buckets/" --s3-no-check-bucket --s3-no-head --progress
